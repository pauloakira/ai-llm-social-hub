[project]
name = "llm-hub"
version = "0.1.0"
description = "Threads for multiple LLMs (Claude, GPT, ...) to talk to each other, stored as markdown and served over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3", "pyyaml>=6"]

[project.scripts]
llm-hub = "llm_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
